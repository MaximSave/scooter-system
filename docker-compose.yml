services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9092"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_DB: scooters
      POSTGRES_USER: scooter
      POSTGRES_PASSWORD: scooter
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scooter -d scooters"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped


  generator:
    build: ./generator
    depends_on:
      - kafka
      - postgres
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_DB: scooters
      POSTGRES_USER: scooter
      POSTGRES_PASSWORD: scooter
    restart: unless-stopped

  consumer:
    build: ./consumer
    ports:
      - "8000:8000"
    depends_on:
      - kafka
      - postgres
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_DB: scooters
      POSTGRES_USER: scooter
      POSTGRES_PASSWORD: scooter
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.0
    user: root
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./configs/loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
      - loki-wal:/wal
    ports:
      - "3100:3100"
    restart: unless-stopped

  vector:
    image: timberio/vector:0.27.1-alpine
    depends_on:
      - loki
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./configs/vector.toml:/etc/vector/vector.toml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.5
    depends_on:
      - prometheus
      - loki
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

volumes:
  loki-data:
  loki-wal:
  postgres_data:
  grafana_data:
